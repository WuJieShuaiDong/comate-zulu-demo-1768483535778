version: '3.8'

services:
  quant-system:
    # 自动构建当前目录下的 Dockerfile
    build: .
    container_name: quant-trader
    # 自动重启策略
    restart: always
    
    # 端口映射
    ports:
      - "8503:8503"
    
    # 关键修改：数据挂载
    # 格式：宿主机路径:容器路径
    # 这样容器就能直接读写您本地的 data 目录，无需在构建时 COPY
    volumes:
      - ./quant_trading/data:/app/data
      - ./quant_trading/logs:/app/logs
      # 开发模式：取消下面注释可实现代码热更新
      # - ./quant_trading:/app

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G